name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC to Azure (no stored Azure secrets)

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_FILE: environments/prod.tfvars

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: check repo settings
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          missing=()
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT CLOUDFLARE_API_TOKEN; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if grep -q 'CHANGE-ME' "$TF_VAR_FILE"; then missing+=("CHANGE-ME placeholders in terraform/$TF_VAR_FILE"); fi
          if (( ${#missing[@]} )); then
            printf '::error::Not configured yet: %s (see README "Setup"; AZURE_* variables map to ARM_*)\n' "${missing[*]}"
            exit 1
          fi

      - name: init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=prod.terraform.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: validate
        run: terraform validate

      - name: plan
        run: |
          set -o pipefail
          terraform plan -var-file="$TF_VAR_FILE" -no-color -lock-timeout=5m | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # add required reviewers on this environment for a manual gate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: check repo settings
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          missing=()
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT CLOUDFLARE_API_TOKEN; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if grep -q 'CHANGE-ME' "$TF_VAR_FILE"; then missing+=("CHANGE-ME placeholders in terraform/$TF_VAR_FILE"); fi
          if (( ${#missing[@]} )); then
            printf '::error::Not configured yet: %s (see README "Setup"; AZURE_* variables map to ARM_*)\n' "${missing[*]}"
            exit 1
          fi

      - name: init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=prod.terraform.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: plan
        run: terraform plan -var-file="$TF_VAR_FILE" -no-color -lock-timeout=5m -out=tfplan

      - name: apply
        run: terraform apply -no-color -lock-timeout=5m tfplan
